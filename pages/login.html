<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EarnZone — Login / Sign Up</title>
  <link rel="icon" href="../favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .box { background: var(--dark2); border: 1px solid var(--border); border-radius: 20px; padding: 36px; width: 100%; max-width: 400px; }
    .box-logo { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .box-logo span { color: var(--gold); }
    .box-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .tabs { display: flex; background: var(--dark3); border-radius: 10px; padding: 4px; margin-bottom: 24px; }
    .tab { flex: 1; padding: 8px; border: none; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .tab.active { background: var(--dark); color: var(--text); }
    .form-group { margin-bottom: 14px; }
    .submit-btn { width: 100%; padding: 12px; background: var(--gold); color: var(--dark); font-size: 14px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; font-family: 'Inter', sans-serif; margin-top: 4px; transition: all 0.2s; }
    .submit-btn:hover { background: var(--gold-dark); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; padding: 8px 12px; background: rgba(239,68,68,0.1); border-radius: 8px; }
    .bonus { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--gold); margin-bottom: 20px; text-align: center; }
    .divider { text-align: center; color: var(--muted); font-size: 12px; margin: 16px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 44%; height: 1px; background: var(--border); }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body>
  <div class="box fade-up">
    <div class="box-logo">Earn<span>Zone</span></div>
    <div class="box-sub">Your points are waiting!</div>
    <div class="bonus">🎁 Sign up & get 100 free bonus points!</div>
    <div class="tabs">
      <button class="tab active" onclick="show('login')">Login</button>
      <button class="tab" onclick="show('signup')">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="le" placeholder="you@example.com" /></div>
      <div class="form-group"><label>Password</label><input type="password" id="lp" placeholder="••••••••" /></div>
      <div class="error" id="lerr">Invalid email or password.</div>
      <button class="submit-btn" id="lbtn" onclick="doLogin()">Login →</button>
    </div>

    <!-- SIGNUP -->
    <div id="signupForm" style="display:none;">
      <div class="form-group"><label>Full Name</label><input type="text" id="sn" placeholder="Your name" /></div>
      <div class="form-group"><label>Email</label><input type="email" id="se" placeholder="you@example.com" /></div>
      <div class="form-group"><label>Password (min 6 chars)</label><input type="password" id="sp" placeholder="••••••••" /></div>
      <div class="form-group"><label>Referral Code (optional)</label><input type="text" id="sr" placeholder="Enter code for bonus points" /></div>
      <div class="error" id="serr">Please fill all fields correctly.</div>
      <button class="submit-btn" id="sbtn" onclick="doSignup()">Create Account & Earn →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../js/app.js"></script>
  <script>
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // If already logged in go to dashboard
    auth.onAuthStateChanged(u => { if (u) window.location.href = 'dashboard.html'; });

    function show(tab) {
      document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('active', (i===0)===(tab==='login')));
      document.getElementById('loginForm').style.display = tab==='login' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = tab==='signup' ? 'block' : 'none';
    }

    async function doLogin() {
      const email = document.getElementById('le').value.trim();
      const pass = document.getElementById('lp').value;
      const btn = document.getElementById('lbtn');
      const err = document.getElementById('lerr');
      err.style.display = 'none';
      if (!email || !pass) { err.textContent = 'Please fill all fields.'; err.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = 'Logging in...';
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        window.location.href = 'dashboard.html';
      } catch(e) {
        err.textContent = 'Invalid email or password!';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Login →';
      }
    }

    async function doSignup() {
      const name = document.getElementById('sn').value.trim();
      const email = document.getElementById('se').value.trim();
      const pass = document.getElementById('sp').value;
      const ref = document.getElementById('sr').value.trim().toUpperCase();
      const btn = document.getElementById('sbtn');
      const err = document.getElementById('serr');
      err.style.display = 'none';
      if (!name || !email || pass.length < 6) {
        err.textContent = 'Please fill all fields correctly (min 6 char password).';
        err.style.display = 'block'; return;
      }
      btn.disabled = true; btn.textContent = 'Creating account...';
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        const uid = cred.user.uid;
        const code = Math.random().toString(36).substring(2,8).toUpperCase();
        // Save user to Firestore (0 pts until email verified)
        await db.collection('users').doc(uid).set({
          name, email, points: 100, referralCode: code,
          emailVerified: true, referrals: 0, referredBy: ref || null,
          joinedAt: firebase.firestore.FieldValue.serverTimestamp(),
          history: [{ amount: 100, reason: 'Welcome bonus 🎁', date: new Date().toISOString() }]
        });
        await db.collection('referrals').doc(code).set({ uid });
        // Reward referrer
        if (ref) {
          const refDoc = await db.collection('referrals').doc(ref).get();
          if (refDoc.exists) {
            await db.collection('users').doc(refDoc.data().uid).update({
              points: firebase.firestore.FieldValue.increment(50),
              referrals: firebase.firestore.FieldValue.increment(1),
              history: firebase.firestore.FieldValue.arrayUnion({ amount: 50, reason: 'Referral bonus 👥', date: new Date().toISOString() })
            });
          }
        }
        window.location.href = 'dashboard.html';
      } catch(e) {
        let msg = 'Something went wrong. Try again.';
        if (e.code === 'auth/email-already-in-use') msg = 'Email already registered. Please login.';
        err.textContent = msg;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Create Account & Earn →';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (document.getElementById('loginForm').style.display !== 'none') doLogin();
        else doSignup();
      }
    });
  </script>
</body>
</html>
