<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EarnZone — Login / Sign Up</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <meta property="og:title" content="EarnZone — Watch. Play. Earn Real Money." />
  <meta property="og:description" content="Earn real money watching videos and playing games. Redeem via eSewa, Khalti or PayPal!" />
  <meta property="og:image" content="../og-image.svg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .auth-box { background: var(--dark2); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; animation: fadeUp 0.4s ease both; }
    .auth-logo { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .auth-logo span { color: var(--gold); }
    .auth-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
    .tabs { display: flex; background: var(--dark3); border-radius: 10px; padding: 4px; margin-bottom: 28px; }
    .tab-btn { flex: 1; padding: 9px; border: none; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .tab-btn.active { background: var(--dark); color: var(--text); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input { width: 100%; padding: 12px 16px; background: var(--dark3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--gold); }
    input::placeholder { color: var(--muted); }
    .submit-btn { width: 100%; padding: 13px; background: var(--gold); color: var(--dark); font-size: 15px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; font-family: 'Syne', sans-serif; margin-top: 8px; transition: all 0.2s; }
    .submit-btn:hover { background: var(--gold-dark); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .bonus-banner { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--gold); margin-bottom: 24px; text-align: center; }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="auth-box">
    <div class="auth-logo">Earn<span>Zone</span></div>
    <div class="auth-sub">Your points are waiting!</div>
    <div class="bonus-banner">🎁 Sign up today — get 100 FREE bonus points!</div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com" /></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" /></div>
      <div class="error-msg" id="loginError"></div>
      <button class="submit-btn" id="loginBtn" onclick="doLogin()">Login →</button>
    </div>

    <div id="signupForm" style="display:none;">
      <div class="form-group"><label>Full Name</label><input type="text" id="signupName" placeholder="Your name" /></div>
      <div class="form-group"><label>Email</label><input type="email" id="signupEmail" placeholder="you@example.com" /></div>
      <div class="form-group"><label>Password</label><input type="password" id="signupPass" placeholder="Min. 6 characters" /></div>
      <div class="form-group"><label>Referral Code (optional)</label><input type="text" id="signupRef" placeholder="Enter code for bonus points" /></div>
      <div class="error-msg" id="signupError"></div>
      <button class="submit-btn" id="signupBtn" onclick="doSignup()">Create Account & Earn →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { auth, ezSignup, ezLogin, onAuthStateChanged } from '../js/firebase.js';

    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'dashboard.html';
    });

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i === 0) === (tab === 'login')));
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    };

    window.doLogin = async function() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.disabled = true; btn.textContent = 'Logging in...';
      const res = await ezLogin(email, pass);
      if (res.success) {
        window.location.href = 'dashboard.html';
      } else {
        err.textContent = 'Invalid email or password!';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Login →';
      }
    };

    window.doSignup = async function() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pass = document.getElementById('signupPass').value;
      const ref = document.getElementById('signupRef').value.trim();
      const btn = document.getElementById('signupBtn');
      const err = document.getElementById('signupError');
      if (!name || !email || pass.length < 6) {
        err.textContent = 'Please fill all fields correctly!';
        err.style.display = 'block'; return;
      }
      btn.disabled = true; btn.textContent = 'Creating account...';
      const res = await ezSignup(name, email, pass, ref);
      if (res.success) {
        window.location.href = 'dashboard.html';
      } else {
        err.textContent = res.error || 'Something went wrong!';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Create Account & Earn →';
      }
    };

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const isLogin = document.getElementById('loginForm').style.display !== 'none';
        isLogin ? window.doLogin() : window.doSignup();
      }
    });
  </script>
</body>
</html>
